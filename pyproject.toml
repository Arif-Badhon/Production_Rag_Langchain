[project]
name = "production-rag-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arif", email = "arifuzzaman.badhon1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
production-rag-langchain = "production_rag_langchain:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
